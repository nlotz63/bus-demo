<div class="econ-interactive-container">
  <div class="wrapper">
    <div class="item-narrative">
      <div *ngIf="mode === 0" class="econ-narative-block" @myAnimationTrigger>
        <table>
          <caption>Demand Schedule</caption>
          <thead>
            <tr><th>Price (dollars per pair of shoes)</th><th>Quantity (millions of pairs of shoes per week)</th></tr>
          </thead>
          <tbody>
            <tr [class.highlight]="slider.value.price === 175">
              <td>$175</td><td>7</td>
            </tr>

            <tr [class.highlight]="slider.value.price === 150">
              <td>$150</td><td>8</td>
            </tr>
            <tr [class.highlight]="slider.value.price === 125">
              <td>$125</td><td>9</td>
            </tr>
            <tr [class.highlight]="slider.value.price === 100">
              <td>$100</td><td>10</td>
            </tr>
            <tr [class.highlight]="slider.value.price === 75">
              <td>$75</td><td>11</td>
            </tr>
            <tr [class.highlight]="slider.value.price === 50">
              <td>$50</td><td>12</td>
            </tr>
            <tr [class.highlight]="slider.value.price === 25">
              <td>$25</td><td>13</td>
            </tr>

          </tbody>

        </table>

        <econ-slider
        class="econ-control"
        label="Price"
        showValue="false"
        displayValue="{{slider.value.price! | currency: 'USD' : 'symbol' : '0.0-0' }}"
        [min]="25"
        [max]="175"
        step="25"
        [value]="slider.value.price!"
        (valueChange)="updateChart({ price: $event })"
      ></econ-slider>


      </div>
      </div>
    <div id="chart1" class="item-chart"></div>
  </div>
  <app-player
    *ngIf="showPlayer"
    [steps]="6"
    [mode]="mode"
    (modeChange)="playStep($event)"
    class="player-navigation-container"
  ></app-player>
</div>
