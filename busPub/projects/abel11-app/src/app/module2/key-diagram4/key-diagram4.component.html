<div class="econ-interactive-container">
  <div class="wrapper">
  <div class="item-narrative">
    <div *ngIf="mode === 0" @myAnimationTrigger>
      <h2>Saving Curve</h2>
      <ul>
        <li>Bullet point 1</li>
        <li>Bullet point 2</li>
        <li>Bullet point 3</li>
      </ul>
      <econ-slider
        label="Real interest rate"
        showValue="false"
        [min]="0.25"
        [max]="5"
        step=".1"
        [value]="slider.value.rRate!"
        #startValue
        (valueChange)="slider.patchValue({ rRate: $event });updateChart(false);updateChart(false)"
      ></econ-slider>
      {{ slider.value.rRate }}%
    </div>
</div>
  <div id="chart1" class="item-chart"></div>
</div>
<app-player
*ngIf="showPlayer"
[steps]="5"
[mode]="mode"
(modeChange)="playStep($event)"
class="player-navigation-container"
></app-player>

</div>
