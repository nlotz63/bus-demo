<div class="econ-interactive-container">
  <div class="wrapper">
    <div class="item-narrative" *ngIf="mode === 0">
      <h2>Step 1</h2>
      <p>{{mode}}</p>
    </div>
    <div class="narrative-item" *ngIf="mode === 1">
      <h2>Step 2</h2>
      <p>{{mode}}</p>

    </div>
    <div class="narrative-item" *ngIf="mode === 2">
      <h2>Step 3</h2>
      <p>{{mode}}</p>

    </div>
    <div id="chart1" class="item-chart">
      <h2>Chart will go here</h2>
    </div>
    </div>
    <app-player [steps]="3" (modeChange)="mode = $event" class="player-navigation-container"></app-player>
    </div>
